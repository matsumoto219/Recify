# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  external_service_monitor:
    class: ExternalServiceMonitorJob
    queue: default
    schedule: every minute

  notification_cleanup:
    class: NotificationCleanupJob
    queue: default
    schedule: at 3am every day

  guest_user_cleanup:
    class: GuestUserCleanupJob
    queue: default
    schedule: at 3:30am every day

  orphan_blob_cleanup_dry_run:
    class: Storage::OrphanBlobCleanupJob
    queue: default
    args: [ { dry_run: true, limit: 100 } ]
    schedule: at 3:45am every day

  receipt_image_purge_dry_run:
    class: Storage::ReceiptImagePurgeJob
    queue: default
    args: [ { dry_run: true, limit: 100 } ]
    schedule: at 3:50am every day

  receipt_analysis_run_stale_cleanup_dry_run:
    class: ReceiptAnalysisRunStaleCleanupJob
    queue: default
    args: [ { dry_run: true, limit: 100 } ]
    schedule: at 4am every day

  receipt_analysis_run_retention_cleanup_dry_run:
    class: ReceiptAnalysisRunRetentionCleanupJob
    queue: default
    args: [ { dry_run: true, limit: 1000 } ]
    schedule: at 4:15am every day

  user_session_retention_cleanup_dry_run:
    class: UserSessionRetentionCleanupJob
    queue: default
    args: [ { dry_run: true, limit: 1000 } ]
    schedule: at 3:05am every day

  contact_request_retention_cleanup_dry_run:
    class: ContactRequestRetentionCleanupJob
    queue: default
    args: [ { dry_run: true, limit: 1000 } ]
    schedule: at 3:20am every day

  audit_log_retention_cleanup_dry_run:
    class: AuditLogRetentionCleanupJob
    queue: default
    args: [ { dry_run: true, limit: 1000 } ]
    schedule: at 2:45am every day

  security_event_retention_cleanup_dry_run:
    class: SecurityEventRetentionCleanupJob
    queue: default
    args: [ { dry_run: true, limit: 1000 } ]
    schedule: at 2:55am every day

  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
