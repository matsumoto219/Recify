      show:
        title: "設定詳細: %{key}"
        subtitle: 設定詳細
        snapshot_limit_note: snapshot上限を大きくすると解析snapshotのjsonbサイズが増えます。receipt_items_per_receipt の最大値以上に設定してください。
        operation_service_toggle_note: OCR / AI の外部API呼び出しを管理者が停止する高リスクな運用スイッチです。OCR停止中は画像解析を開始できません。AI停止中はAI補完を行わずOCR結果のみで保存します。外部API費用や障害対応時にのみ変更してください。
        amount_engine_tax_excluded_price_conversion_note: OCR/AI解析時に税抜と判断した明細を税込のprice/line_totalへ補正する高リスク設定です。OFFにすると解析保存金額、明細保存値、候補採用、要確認理由が変わる可能性があります。手動作成・編集保存には適用されません。
        amount_limit_note: 金額系フィールドのアプリ上限です。大きくしすぎると手動入力、OCR/AI解析結果、金額計算、管理画面表示に影響する可能性があります。DBはbigintですが、運用上の上限として慎重に変更してください。
        usage_limit_safety_note: UserLimitsで設定できる最大値のシステム上限です。アップロード、OCR、AI、ストレージのコストに直結するため、変更前に関連する利用上限とユーザー別上限を確認してください。
        receipt_adjustments_limit_note: 1レシートに保存できる調整行の最大数です。値引き・返品・調整行が大量にある特殊ケース向けで、大きくしすぎると金額計算や確認画面が重くなる可能性があります。
        receipt_payments_limit_note: 1レシートに保存できる支払い情報の最大数です。OCRのPayments配列が異常に多い場合のDB肥大化を防ぎます。大きくしすぎると解析snapshotや管理画面表示が重くなる可能性があります。
        notifications_limit_note: 1ユーザーあたりDBに保持する通知の最大件数です。通知一覧の1回表示件数とは別で、大きくしすぎると通知一覧とDB容量に影響する可能性があります。
        batch_upload_max_files_note: 1回の操作でアップロードできる最大ファイル数です。日次アップロード上限、OCR/AIの日次上限、ストレージ上限とは別設定です。大きくしすぎるとOCR処理、AI処理、キュー、ブラウザ負荷に影響する可能性があります。
        notifications_read_retention_note: 既読通知を保持する日数です。未読通知はこの保持期間では削除されません。1ユーザーあたりの通知保持件数とは別設定です。
        guest_users_retention_note: ゲストユーザーと関連データを保持する日数です。期間を長くすると本登録前のデータ保持期間は伸びますが、ストレージ使用量も増える可能性があります。
        user_sessions_retention_note: ユーザーセッション履歴を保持する日数です。active session保護期間(30日)以上である必要があります。短くすると履歴確認期間が短くなります。
        contact_requests_retention_note: 解決済みまたはクローズ済み問い合わせのPIIを匿名化するまでの日数です。未対応・対応中の問い合わせは対象外で、hard deleteではなく匿名化します。短くしすぎると問い合わせ履歴確認期間が短くなり、長くしすぎるとPII保持期間が伸びます。
        analysis_runs_retention_note: 解析runのexpires_at計算に使う保持期間です。shortはskipped/superseded/canceled、defaultは通常解析、failedはfailed/review/admin_retry向けです。failed >= default >= short の関係を維持してください。
        orphan_blobs_retention_note: 添付されていないBlobを削除対象とみなすまでの時間です。短くしすぎるとdirect upload直後などのBlobを誤検出するリスクがあります。実ファイル削除に影響する高リスク設定のため、dry-run結果を確認して慎重に変更してください。
        receipt_images_retention_note: keep_image=false のレシート画像を削除対象とみなすまでの日数です。短くしすぎると画像確認期間が短くなります。実ファイル削除に影響する高リスク設定のため、dry-run結果を確認して慎重に変更してください。
