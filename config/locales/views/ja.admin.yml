        warning: Cloudflare関連headerが確認できない、またはCloudflare経路か判断できません。ローカル/直アクセスでは正常ですが、本番Cloudflare配下で再確認してください。
        danger: proxy / forwarded header の状態から、Cloudflare edge IP や proxy IP を制限対象にする可能性があります。本番IP制限運用は停止してください。
        unknown: リクエストIP情報を判定できません。本番IP制限運用は停止し、trusted proxy と Rack::Attack key を確認してください。
