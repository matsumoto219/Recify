          store_name_casing_snapshot_ocr_lines_limit: store_name_casing_context_lines_max を上げるには、先に snapshot_ocr_lines_max を同等以上に変更してください。
          snapshot_ocr_lines_store_name_casing_limit: snapshot_ocr_lines_max を store_name_casing_context_lines_max 未満にできません。snapshot_ocr_lines_max を下げるには、先に store_name_casing_context_lines_max を同等以下に変更してください。
          user_limit_safety_max: UserLimitsのシステム上限を超えています。関連する利用上限またはユーザー別上限を先に同等以下へ変更してください。
          analysis_run_retention_order: 解析run保持期間は failed >= default >= short の関係を維持してください。
          ocr_raw_response_retention: ocr_raw_response_retention_days を analysis_runs_failed_days より長くできません。raw OCR JSONの保持期間を伸ばすには、先に analysis_runs_failed_days を同等以上に変更してください。
