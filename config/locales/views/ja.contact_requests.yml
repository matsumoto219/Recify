    new:
      title: お問い合わせ
      subtitle: アカウント、レシート解析、不具合などについてサポートへ連絡できます。
      safety_title: 安全のため、必要な範囲の情報のみ入力してください。
      safety_items:
        - パスワード、認証コード、復旧用コードは入力しないでください。
        - クレジットカード番号など、本人確認に不要な情報は入力しないでください。
        - レシート内容など個人情報を含む場合は、必要な範囲に絞って記載してください。
    fields:
      email: 返信先メールアドレス
      category: 種別
      subject: 件名
      body: 内容
      company_name: 会社名
