      category: 種別を選択
      subject: 例）レシート解析結果について
      body: 状況、発生日時、レシートID、操作内容などを入力してください。
    categories:
      bug: 不具合
      account: アカウント
      receipt_analysis: レシート解析
      security: セキュリティ
      other: その他
    statuses:
      open: 未対応
      in_progress: 対応中
      resolved: 解決済み
      closed: クローズ
    sources:
      authenticated: 本登録ユーザー
      guest: ゲストユーザー
      public: 未ログイン
    buttons:
      submit: 送信する
