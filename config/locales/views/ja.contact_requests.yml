ja:
  contact_requests:
    navigation:
      back_to_top: トップへ戻る
    new:
      title: お問い合わせ
      subtitle: アカウント、レシート解析、不具合などについてサポートへお問い合わせできます。
      safety_title: 安全のため、必要な範囲の情報のみ入力してください。
      safety_items:
        - パスワード、認証コード、リカバリーコードは入力しないでください。
        - クレジットカード番号など、本人確認に不要な情報は入力しないでください。
        - レシート内容など個人情報を含む場合は、必要な範囲に絞って記載してください。
    fields:
      sender_name: お名前
      email: 返信先メールアドレス
      category: 種別
      subject: 件名
      body: 内容
      company_name: 会社名
    placeholders:
      sender_name: 任意
      email: contact@example.com
      category: 種別を選択
      subject: 例）レシート解析結果について
      body: 状況、発生日時、レシートID、操作内容などを入力してください。
    categories:
      bug: 不具合
      account: アカウント
      receipt_analysis: レシート解析
      security: セキュリティ
      other: その他
    statuses:
      open: 未対応
      in_progress: 対応中
      resolved: 解決済み
      closed: クローズ
    sources:
      authenticated: 本登録ユーザー
      guest: ゲストユーザー
      public: 未ログイン
    buttons:
      submit: 送信する
      submitting: 送信中...
    messages:
      created: お問い合わせを受け付けました。
      create_failed: 入力内容を確認してください。
    mailer:
      admin_notification:
        subject: "[Recify %{request_uid}] 問い合わせ: %{category}"
        title: 新しい問い合わせを受け付けました
        description: 問い合わせの詳細は管理画面で確認してください。
        fields:
          request_uid: 受付ID
          category: 種別
          subject: 件名
          user_id: ユーザーID
          email: 返信先
          email_digest: 返信先識別子
          created_at: 受付日時
          source: 送信元
          request_id: リクエストID
        body_notice: 本文は個人情報を含む可能性があるため、この通知メールには全文を載せていません。
        open_admin: 管理画面で確認する
      auto_reply:
        subject: "[Recify %{request_uid}] お問い合わせを受け付けました"
        title: お問い合わせを受け付けました
        description: |
          お問い合わせありがとうございます。
          内容を確認のうえ、必要に応じて返信いたします。
          返信までお時間をいただく場合があります。

          ※すべてのお問い合わせに対して返信をお約束するものではございません。あらかじめご了承ください。
        fields:
          request_uid: 受付ID
          created_at: 受付日時
          category: 種別
          subject: 件名
        body_notice: 安全のため、お問い合わせ本文の全文はこのメールには記載していません。
