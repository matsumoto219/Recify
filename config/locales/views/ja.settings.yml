      appearance:
        theme_label: 表示テーマ
        theme_description: アプリケーションの見た目を設定します
        theme_options:
          system: 自動
          light: ライト
          dark: ダーク
        theme_hint: ※ 「自動」を選択すると、OSのシステム設定に応じてテーマが切り替わります。
      calculation:
        description: 手動入力・編集時の自動計算に適用します
        hint: ※ OCR/AI解析結果の端数処理には適用されません。
        rounding_options:
          floor: 切り捨て
          round: 四捨五入
          ceil: 切り上げ
        tax_rounding:
          label: 税額の端数処理
          description: 手動入力・編集時に税額を自動計算する際の丸め方です。
        discount_rounding:
          label: 割引額の端数処理
          description: 手動入力・編集時に割引率から割引額を自動計算する際の丸め方です。
      usage:
        push_notification:
          label: 通知
          description: レシート処理の完了や要確認項目を通知します
        delete_confirmation:
          label: 削除確認
          description: レシート明細や通知を削除する前に確認ダイアログを表示します
        product_name_ai_completion:
          label: AI補完
          description: |-
            商品名をAIが補完します
            補完内容は正確でない可能性があるため、必ず内容を確認してください
        keep_receipt_images:
          label: レシート画像を保存
          description: |-
            OFFにすると解析後にレシート画像を削除します
            設定変更後に登録されたレシートは、画像プレビューやダウンロードができなくなります
      support:
        description: 困ったことや不具合等をサポートへお問い合わせできます。
        contact: お問い合わせを開く
      danger:
        delete_account: 退会
        confirm: |-
          退会すると、アカウントに紐づくすべてのデータが削除されます。
          この操作は取り消すことができませんのでご注意ください。
          必要なレシートは事前にダウンロードすることをおすすめします。

          本当にアカウントを削除してもよろしいですか？
        hint: 退会するとアカウントに紐づくデータが削除されます。この操作は取り消すことができませんのでご注意ください。
    account:
