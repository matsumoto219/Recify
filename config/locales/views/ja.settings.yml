            secret_label: 設定キー
            code_label: 確認コード
            code_placeholder: "123456"
            code_hint: 認証アプリに表示された6桁のコードを入力してください。
            cancel: 戻る
            submit: 有効化する
            submitting: 確認中...
          messages:
            unavailable: 本登録後にこの設定を利用できます。
            already_enabled: 認証アプリはすでに有効です。
            setup_expired: 認証アプリ設定の有効期限が切れました。もう一度お試しください。
            setup_failed: 確認コードが一致しませんでした。もう一度入力してください。
            not_enabled: 認証アプリを先に有効化してください。
            disabled: 認証アプリと回復コードを無効化しました。
