      status:
        title: 処理ステータス
        items:
          - アップロード完了
          - OCR処理完了
          - AI処理完了
          - 要確認
          - 保存準備完了
    problem:
      title: レシート管理、後回しになっていませんか？
      items:
        - icon: draw
          title: 手入力が面倒
          body: レシートの入力に時間がかかり、つい後回しになってしまう。
        - icon: search
          title: あとから探しにくい
          body: 必要なレシートが見つからず、確認に手間がかかる。
        - icon: shield_question
          title: 確認作業が不安
          body: 金額や明細の見落としが心配で、記録に自信が持てない。
    before_after:
      title: 撮ったレシートを、見返せる記録へ。
      lead: 写真や紙のまま残したレシートを、店舗名・日付・金額・明細ごとに整理された記録へ変えていきます。
      before:
        label: Before
        title: 未整理のレシート
        body: 画像や紙のままだと、金額・日付・明細をあとから探すのに時間がかかります。
        items:
          - 写真だけで残っている
          - 店舗名や金額を探しにくい
          - 確認が後回しになりやすい
      after:
        label: After
        title: 整理された記録
        body: 店舗名・日付・金額・明細をまとめ、あとから確認しやすい記録へ整えます。
        items:
          - 店舗名、日付、金額を一覧化
          - 明細やカテゴリを確認しやすい
          - あとから検索しやすい
    features:
      title: 読み取りから整理まで、ひとつの流れで。
      items:
        - icon: cloud_upload
          title: レシート画像アップロード
          body: スマホやPCからレシート画像をアップロードできます。
        - icon: document_scanner
          title: OCRで自動読み取り
          body: 店舗名・日付・金額・明細を読み取りやすい形にします。
        - icon: auto_awesome
          title: AIで補完
          body: カテゴリや支払い方法などを整理しやすく補完します。
        - icon: priority_high
          title: 要確認ステータス
          body: 不確かな項目は確認対象として整理できます。
        - icon: list_alt
          title: 一覧で管理
          body: 整理された記録を一覧で確認・検索できます。
    announcements:
      badge: Public Notice
      title: お知らせ
      lead: Recifyからの最新情報や予定をお届けします。
      list_aria: 公開中のお知らせ
      limit_note: "最新%{count}件を表示中"
      pinned: 固定
    how_it_works:
      title: 使い方はシンプル。
      save_label: 保存する
      steps:
        - title: 撮る・アップロードする
          body: レシートを撮影するか、画像を選んでアップロード。
        - title: 読み取る
          body: OCRが内容を読み取り、AIが必要な情報を補完します。
        - title: 確認して保存する
          body: 内容を確認し、必要に応じて編集して保存できます。
    trust:
      title: 安心して使えるレシート管理を。
      items:
        - icon: passkey
          title: パスキー対応
          body: 安全でスムーズなログインをサポートします。
        - icon: lock
          title: 2段階認証
          body: 不正アクセスを防ぐ追加認証に対応しています。
        - icon: key
          title: リカバリーコード
          body: 万が一の時に備えて、アカウント復旧手段を利用できます。
        - icon: monitor_heart
          title: 処理状態を確認
          body: 読み取りや補完の進行状況を確認できます。
        - icon: cloud_off
          title: サービス停止時の制御
          body: 読み取りや補完に問題がある場合でも、安全に停止・制御できる設計です。
    notice: 本画面は開発中のモックであり、実際の仕様・デザインとは異なる場合があります。
    final_cta:
      heading_lines:
        - レシート整理を、
        - 今日からもっと簡単に。
      description: Recifyで、手間なく、見つけやすく、安心して使えるレシート管理を始めましょう。
      login: ログイン
      sign_up: 新規登録
      contact: お問い合わせ
