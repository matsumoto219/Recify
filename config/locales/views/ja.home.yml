ja:
  home:
    meta:
      title: Recify
    hero:
      badge: 自動解析で、レシート整理をスムーズに
      heading_lines:
        - レシートを撮るだけ。
        - 支出記録をもっと簡単に。
      description:
        - Recifyは、レシート画像から店舗名・金額・明細を読み取り、AI補完で整理をサポートするレシート管理アプリです。
        - 手入力の手間を減らし、あとから確認しやすい記録を残せます。
      login: ログイン
      sign_up: 新規登録
    section_nav:
      label: LPセクション
      hero: トップ
      announcements: お知らせ
      problem: 課題
      before_after: Before / After
      features: 機能
      how_it_works: 使い方
      trust: 安心
      final_cta: はじめる
    flow:
      steps:
        - icon: receipt_long
          label: レシート画像
        - icon: document_scanner
          label: OCR
        - icon: auto_awesome
          label: AI
        - icon: task_alt
          label: 保存
    hero_mock:
      aria_label: レシート解析画面のモック
      receipt:
        title: レシート
        merchant: SHOP MART
        datetime: 2026/05/10(土) 12:34
        label: 領収書
        items:
          - name: ミネラルウォーター
            amount: ¥108
          - name: サンドイッチ
            amount: ¥358
          - name: コーヒー
            amount: ¥150
          - name: スナック菓子
            amount: ¥120
        subtotal_label: 小計
        tax_label: 内消費税 8%
        total_label: 合計
        total_amount: ¥736
      result:
        title: 読み取り結果
        rows:
          - label: 店舗名
            value: SHOP MART
          - label: 日付
            value: 2026/05/10 12:34
          - label: 合計金額
            value: ¥736
          - label: 登録方法
            value: OCR
      detail:
        title: 明細
        add: + 明細を追加
        items:
          - name: ミネラルウォーター
            category: 飲料
            amount: ¥108
          - name: サンドイッチ
            category: 食品
            amount: ¥358
          - name: コーヒー
            category: 飲料
            amount: ¥150
          - name: スナック菓子
            category: 食品
