        aria_label: 新規登録案内
        prompt: アカウントをお持ちではありませんか？
        link: 新規登録
      divider: または
      guest:
        title: ゲストログイン
        button: ゲストとして試す
        description_line1: 一部機能をすぐに体験できます。
        description_line2: 一定期間利用がない場合、データは自動的に削除されます。
    two_factor:
      messages:
        pending_notice: 追加認証を完了してください。
        expired: 追加認証の有効期限が切れました。もう一度ログインしてください。
      links:
        heading: 他の方法で認証できます
        passkey: パスキーで認証
        totp: 認証アプリのコードを使う
        recovery_code: 回復コードを使う
      passkey:
        title: 追加認証
        subtitle: パスキーでログインを完了してください
        card_title: パスキー追加認証
        description: 続けるには、登録済みのパスキーでログインしてください。
        button: パスキーで認証
        back_to_login: ログインに戻る
        messages:
          unsupported: このブラウザはパスキーでの認証に対応していません。
          canceled: パスキー認証がキャンセルされました。
          failure: パスキー認証に失敗しました。別の方法でも認証できます。
          request_failed: リクエストに失敗しました。
      totp:
        title: 追加認証
        subtitle: 認証アプリのコードでログインを完了してください
        card_title: 認証アプリで追加認証
        description: 認証アプリに表示された6桁のコードを入力してください。
        code_label: 確認コード
        code_placeholder: "123456"
        button: 認証する
        submitting: 確認中...
        back_to_login: ログインに戻る
        messages:
          success: ログインしました。
          failure: コードが一致しませんでした。もう一度入力してください。
      recovery_code:
        title: 追加認証
        subtitle: 保存した回復コードでログインを完了してください
        card_title: 回復コード追加認証
        description: 認証アプリを使えない場合は、保存済みの回復コードを入力してください。
        code_label: 回復コード
        code_placeholder: "ABCD-EFGH-IJKL-MNOP-QRST"
        button: 認証する
        submitting: 確認中...
        back_to_login: ログインに戻る
        messages:
          success: ログインしました。
          failure: 回復コードが一致しませんでした。もう一度入力してください。
    registrations:
      new:
        title: 新規登録
        subtitle: Recifyを始めましょう
        form_title: 新規登録フォーム
        fields:
          email: メールアドレス
          password: パスワード
          password_confirmation: パスワード確認
          minimum_password_length: "%{count}文字以上"
        submit: 登録する
        submitting: 登録中...
        terms:
          aria_label: 規約同意案内
          prefix: Recifyの
          terms: 利用規約
          connector: および
          privacy: プライバシーポリシー
          suffix: に同意します。
        login:
          aria_label: ログイン案内
          prompt: すでにアカウントをお持ちですか？
        login_link: ログインへ
      edit:
        title: アカウント設定
        subtitle: アカウント情報は設定画面で管理できます。
        normal:
          title: アカウント情報は設定画面で管理できます
          description: メールアドレスやパスワードの変更、プロフィール編集はそれぞれの設定画面から行ってください。
        guest:
          title: 本登録はセキュリティ設定から行えます
          description: メールアドレスとパスワードを登録すると、本登録アカウントとして引き続きご利用頂けます。
        buttons:
          security_settings: セキュリティ設定へ
          account_settings: プロフィール設定へ
          guest_registration: 本登録へ進む
    passwords:
      new:
        title: パスワード再設定
        subtitle: 登録したメールアドレスを入力してください
        form_title: パスワード再設定フォーム
        fields:
          email: メールアドレス
        buttons:
          submit: 再設定メールを送信
          submitting: 送信中...
        back_to_login: ログインに戻る
      edit:
        title: パスワード変更
        subtitle: 新しいパスワードを設定してください
        form_title: 新しいパスワード設定フォーム
        fields:
          password: 新しいパスワード
          password_confirmation: 新しいパスワード（確認用）
          minimum_password_length: "%{count}文字以上"
        buttons:
          submit: パスワードを変更
          submitting: 変更中...
        back_to_login: ログインに戻る
    confirmations:
      new:
        title: 確認メール再送
        subtitle: 登録したメールアドレスへ確認メールを再送します
        form_title: 確認メール再送フォーム
        fields:
          email: メールアドレス
          email_placeholder: メールアドレスを入力
        buttons:
          submit: 確認メールを再送
          submitting: 送信中...
        back_to_login: ログインに戻る
        back_to_security: セキュリティ設定へ戻る
        back_to_guest_registration: 本登録設定へ戻る
    unlocks:
      new:
        title: ロック解除メール再送
        subtitle: 登録したメールアドレスへロック解除メールを再送します
        form_title: ロック解除メール再送フォーム
        fields:
          email: メールアドレス
          email_placeholder: メールアドレスを入力
        buttons:
          submit: ロック解除メールを再送
          submitting: 送信中...
        back_to_login: ログインに戻る
    mailer:
      greeting: "%{email} 様"
      layout:
        app_name: Recify
        tagline: Receipt Management
        footer_notice: |-
          このメールはRecifyから送信されています。
          心当たりがない場合は、このメールを破棄してください。
        copyright: "© %{year} Recify. All rights reserved."
      common:
        fallback_url: ボタンが機能しない場合は、以下のURLをブラウザにコピーして開いてください。
        duration:
          days: "%{count}日間"
          hours: "%{count}時間"
          minutes: "%{count}分間"
          seconds: "%{count}秒間"
      reset_password_instructions:
        title: パスワード再設定
        body: パスワード変更のリクエストを受け付けました。以下のリンクから変更できます。
        action: パスワードを変更する
        expires_in: "このリンクは%{duration}有効です。"
        single_use: このリンクは一度使用すると無効になります。
        ignore: このメールに心当たりがない場合は破棄してください。
        protect_account: アカウント保護のため、パスワードやセキュリティ設定を確認してください。
        no_change_until_link: 上記リンクから新しいパスワードを設定するまで、パスワードは変更されません。
      password_change:
        title: パスワード変更のお知らせ
        body: パスワードが変更されたことをお知らせします。
        ignore: この変更に心当たりがない場合は、パスワードを再設定し、アカウントのセキュリティ設定を確認してください。
      unlock_instructions:
        title: アカウントロック解除
        body: ログイン失敗が規定回数を超えたため、アカウントがロックされました。
        instructions: 以下のリンクからアカウントのロックを解除できます。
        action: アカウントのロックを解除する
        auto_unlock: "このリンクから解除するか、約%{duration}後に自動解除されます。"
        ignore: このメールに心当たりがない場合は、アカウントのセキュリティ設定を確認してください。
      confirmation_instructions:
        title: メールアドレスの確認
        body: メールアドレス確認のリクエストを受け付けました。以下のリンクから確認を完了してください。
        action: メールアドレスを確認する
        expires_in: "このリンクは%{duration}有効です。"
        ignore: このメールに心当たりがない場合は破棄してください。
      email_changed:
        title: メールアドレス変更のお知らせ
        changing: "メールアドレスが %{email} に変更されようとしています。"
        changed: "メールアドレスが %{email} に変更されました。"
  devise:
    mailer:
      email_changed:
        subject: メールアドレス変更のお知らせ
