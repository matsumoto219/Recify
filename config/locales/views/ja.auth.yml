        password_placeholder: パスワードを入力
      forgot_password: パスワードをお忘れですか？
      remember_me: ログイン状態を保持する
      submit: ログイン
      submitting: ログイン中...
      passkey:
        button: パスキーでログイン
        messages:
          unsupported: このブラウザはパスキーでのログインに対応していません。
          canceled: パスキーでのログインがキャンセルされました。
          failure: パスキーでログインできませんでした。パスワードでもログインできます。
          request_failed: リクエストに失敗しました。
      messages:
        signed_in: ログインしました。
        session_expired: セッションの有効期限が切れました。もう一度ログインしてください。
