ja:
  search:
    help:
      title: 拡張検索が使えます
      description: スペース区切りでAND検索できます。
      examples:
        - 店舗名 1000
        - 商品名 <=300
        - date>=2026-01-01
        - date:2026-01-01..2026-01-31
      syntax: "金額は <=1000 / >=1000、日付は date>=YYYY-MM-DD の形式で指定できます。"
    realtime:
      error_title: エラー
      error_message: 検索結果を更新できませんでした。通信状況を確認してもう一度お試しください。
      close_label: 閉じる
