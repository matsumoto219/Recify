ja:
  receipt_registration:
    transport_unknown: 通信が途切れ、登録結果を確認できませんでした。レシート一覧をご確認ください。
    notification:
      title: レシートのアップロードに失敗しました
      body: アップロードに失敗しました。画像を選び直して再送してください。理由：%{reason}（エラーコード：%{code}）
      reasons:
        storage_failed: 画像を保存できませんでした
    submission:
      accepted: この登録操作は受付済みです。レシート一覧をご確認ください。
      invalid: 受付情報を確認できません。レシート一覧で登録結果を確認し、必要な場合は新しく登録を始めてください。
      expired: この受付情報の有効期限が切れています。レシート一覧で登録結果を確認し、未登録の場合は新しく登録を始めてください。
      conflict: 同じ受付情報で異なる内容が送信されました。レシート一覧で登録結果を確認してください。新しく登録する場合は、一覧から登録を始めてください。
      processing: この登録操作は処理中、または結果がまだ確認できません。レシート一覧で受付状況をご確認ください。
