      terms:
        summary_notice: この内容は入力中に確認しやすくするための短い要約です。詳細は利用規約の全文で確認してください。
        items:
          - Recifyはレシート管理を支援するサービスであり、税務・会計・法律上の助言を提供するものではありません。
          - 解析処理や金額計算の結果は誤る場合があるため、利用者自身で内容を確認・修正してください。
          - ゲスト利用のデータは一時的で、一定期間利用がない場合や運用上の理由により削除されることがあります。
          - レシート画像には個人情報や購入履歴が含まれる場合があるため、不要な情報が写り込まないよう注意してください。
      privacy:
        items:
          - アカウント情報、問い合わせ内容、レシート画像や解析結果など、サービス提供に必要な情報を取り扱います。
          - レシート管理、解析、問い合わせ対応、不正利用防止、品質改善などの目的で利用します。
          - 保存期間、削除、匿名化、バックアップ、外部サービス利用の扱いは全文で確認できます。
