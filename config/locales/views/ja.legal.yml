    terms:
      title: 利用規約
      meta_description: Recifyの利用条件、レシート画像・OCR・AI補完・金額計算の扱い、禁止事項、退会とデータ削除、免責などを掲載しています。
      lead: Recifyの利用条件、レシート画像・OCR・AI補完・金額計算の扱い、禁止事項、退会とデータ削除、免責などを説明します。
      last_updated_on: 2026年6月21日
      sections:
        - title: はじめに
          paragraphs:
            - この利用規約（以下「本規約」といいます。）は、運営者が提供するRecify（以下「本サービス」といいます。）の利用条件を定めるものです。
            - 本サービスを利用する方（以下「利用者」といいます。）は、本規約に同意したうえで本サービスを利用するものとします。利用者がアカウント登録、ゲスト利用開始、その他本サービス上で本規約への同意を行った場合、本規約に同意したものとみなします。
            - 本サービスは、レシート画像のアップロード、OCR解析、AI補完、明細整理、金額計算などを通じて、レシート管理を支援するサービスです。本サービスは、税務、会計、法律その他の専門的助言を提供するものではありません。
        - title: 適用
          paragraphs:
            - 本規約は、利用者と運営者との間の本サービスの利用に関わる一切の関係に適用されます。
            - 運営者が本サービス上で掲載する個別の案内、注意事項、ヘルプ、ポリシーその他のルールは、本規約の一部を構成します。これらの内容が本規約と異なる場合は、特段の定めがない限り、本規約が優先して適用されます。
            - 利用者情報の取扱いについては、本規約のほか、運営者が別途定めるプライバシーポリシーが適用されます。
        - title: 定義
          paragraphs:
            - 本規約において使用する主な用語の意味は、次のとおりです。
          items:
            - 「本サービス」とは、Recifyとして提供されるレシート管理支援サービスおよびこれに関連する機能をいいます。
            - 「利用者」とは、本サービスを利用するすべての方をいいます。
            - 「登録利用者」とは、アカウント登録を行った利用者をいいます。
            - 「ゲスト利用者」とは、アカウント登録を完了せず、一時的なゲストアカウントで本サービスを利用する方をいいます。
            - 「レシートデータ」とは、レシート画像、店舗名、購入日時、金額、税率、明細、カテゴリ、支払方法、メモ、OCR解析結果、AI補完結果その他レシート管理に関して本サービスに保存または生成される情報をいいます。
            - 「外部サービス」とは、OCR解析、AI補完、不正利用防止、メール送信、サービス提供環境の運用その他本サービスの提供に必要な第三者のサービスをいいます。
        - title: 本サービスの内容
          paragraphs:
            - 本サービスは、利用者が登録またはアップロードしたレシート画像およびレシートデータを管理し、OCR解析、AI補完、明細整理、金額計算、検索、通知、設定管理などを支援します。
            - 本サービスの機能、画面、仕様、提供範囲、利用条件は、運営者の判断により変更、追加、停止または終了される場合があります。
            - 本サービスは、利用者のレシート管理を補助するものであり、領収書、証憑、会計帳簿、税務申告資料その他法令上または業務上必要な資料の正確性、完全性、保存義務の充足を保証するものではありません。正式な証憑、会計資料、税務資料として利用する場合は、利用者自身の責任で原本、取引内容、専門家の助言等を確認してください。
        - title: 利用登録・アカウント管理
          paragraphs:
            - 利用者は、運営者が定める方法により、本サービスの利用登録を行うことができます。
            - 利用者は、登録情報を正確かつ最新の内容に保つものとします。登録情報に誤り、不備または変更がある場合、利用者は速やかに修正または運営者への連絡を行うものとします。
            - 利用者は、自身のメールアドレス、パスワード、二要素認証、パスキー、リカバリーコード、ログイン状態、端末その他アカウントの管理に関する情報を自己の責任で管理するものとします。
            - 利用者は、アカウントを第三者に譲渡、貸与、共有、売買、担保提供その他第三者に利用させる行為をしてはなりません。
            - 運営者から利用者への重要な連絡は、本サービス上の表示、登録メールアドレスへの送信、アプリ内通知、または運営者が適切と判断する方法により行うことがあります。利用者は、登録メールアドレスその他の連絡先を確認可能な状態に保つものとします。
            - 利用者のアカウントを用いて行われた行為は、当該アカウントを管理する利用者による行為とみなされる場合があります。ただし、運営者の故意または重過失により生じた場合、その他法令上利用者に責任を負わせることができない場合はこの限りではありません。
        - title: ゲスト利用
          paragraphs:
            - 本サービスは、登録前に一部機能を試用できるゲスト利用機能を提供する場合があります。
            - ゲスト利用は一時的な利用を想定しており、登録利用者向けの機能、保存期間、容量、解析回数、サポート、復旧可能性等に制限がある場合があります。
            - ゲスト利用者のアカウントおよびレシートデータは、一定期間利用がない場合、システム上の整理、容量管理、不正利用防止その他運用上の理由により削除されることがあります。
            - 利用者が継続的にデータを利用したい場合は、登録利用者としてアカウント登録を完了することを推奨します。ただし、登録後であっても、データの完全な保存、復旧、エクスポートを保証するものではありません。
        - title: レシート画像・入力データの取扱い
          paragraphs:
            - 利用者は、自身が正当な権限を有するレシート画像および入力データのみを本サービスへアップロードまたは入力するものとします。
            - レシート画像には、氏名、電話番号、住所、会員番号、クレジットカードに関する一部情報、購入履歴、医療機関、薬局、嗜好品、趣味嗜好その他個人に関する情報または第三者に関する情報が含まれる場合があります。利用者は、アップロード前に画像内容を確認し、不要な情報、第三者の情報、または本サービスで扱うことを望まない情報が含まれないよう注意してください。
            - 利用者は、他人のレシート、第三者の個人情報、営業秘密、機密情報、権利侵害のおそれがある画像、違法または不適切な内容を含む画像その他本サービスで取り扱うことが適切でない情報をアップロードしてはなりません。
            - 運営者は、セキュリティ、容量管理、不正利用防止、法令遵守、サービス運用上の必要がある場合、アップロードされたファイルの形式、サイズ、画像寸法、内容、利用回数等を制限し、または保存を拒否することがあります。
        - title: OCR解析・AI補完・金額計算の位置付け
          paragraphs:
            - 本サービスのOCR解析、AI補完、金額計算、カテゴリ推定、確認が必要な箇所の判定その他の自動処理は、利用者によるレシート管理を補助する機能です。
            - OCR解析およびAI補完の結果は、レシート画像の状態、文字の読み取りやすさ、レシートの形式、店舗ごとの表記差、外部サービスの仕様、通信状態、自動処理の限界その他の要因により、誤り、不足、重複、不整合を含む場合があります。
            - 店舗名、購入日時、金額、税率、明細、数量、カテゴリ、支払方法、割引、ポイント、調整額、最終的な支払額その他の解析結果または計算結果は、正確性、完全性、最新性、有用性を保証するものではありません。
            - 利用者は、本サービスの解析結果および計算結果を利用する前に、原本のレシート、取引内容、必要に応じて専門家の助言等を確認し、自らの責任で修正、判断、利用するものとします。
            - 本サービスは、税務、会計、法律、経営、金融その他の専門的助言を提供するものではありません。本サービスの表示、解析結果、計算結果、カテゴリ候補、確認理由等に依拠して行われた判断、申告、会計処理、経費精算、証憑管理その他の行為については、利用者自身が責任を負うものとします。
            - 外部サービスの障害、仕様変更、利用制限、送信回数や処理頻度の制限、認証に関する不具合、通信障害その他の理由により、OCR解析、AI補完、メール送信、不正利用防止その他の機能が利用できない場合があります。
        - title: 利用者の責任
          paragraphs:
            - 利用者は、本サービスの利用にあたり、法令、本規約、プライバシーポリシー、運営者が定めるルールおよび社会通念上のルールを遵守するものとします。
            - 利用者は、本サービスに入力またはアップロードする情報について、必要な権利、権限、同意を有していることを確認するものとします。
            - 利用者は、本サービスを利用して保存、解析、編集、出力または参照した情報について、自身の目的に照らして適切性、正確性、利用可否を確認するものとします。
            - 利用者は、自身の利用環境、端末、ブラウザ、通信環境、セキュリティ設定、認証情報を適切に管理するものとします。
        - title: 禁止事項
          paragraphs:
            - 利用者は、本サービスの利用にあたり、次の行為をしてはなりません。
          items:
            - 法令、公序良俗、本規約、プライバシーポリシーまたは運営者が定めるルールに違反する行為
            - 犯罪行為、不正行為、詐欺、違法な会計処理、違法な税務処理その他違法または不適切な目的で本サービスを利用する行為
            - 他者の権利、利益、名誉、信用、プライバシー、営業秘密、知的財産権その他の権利を侵害する行為
            - 他人のレシート画像、個人情報、機密情報、権利侵害のおそれがある画像または利用権限のない情報をアップロード、入力、送信する行為
            - なりすまし、虚偽情報の登録、アカウントの共有、譲渡、貸与、売買、第三者利用
            - 不正アクセス、認証回避、セキュリティ機能の回避、脆弱性探索、攻撃、侵入、改ざん、リバースエンジニアリング、解析、スクレイピング、クローリングその他本サービスの安全性を害する行為
            - 本サービス、サーバー、ネットワーク、外部サービス、他の利用者に過度な負荷をかける行為
            - 送信回数、容量、利用回数、ファイル形式その他本サービス上の制限を回避しようとする行為
            - マルウェア、ウイルス、破損ファイル、実行ファイル、偽装ファイルその他有害または不適切なデータをアップロード、送信、保存する行為
            - OCR解析、AI補完、不正利用防止、問い合わせフォーム、ゲスト利用機能その他本サービスの機能を悪用する行為
            - スパム、迷惑行為、嫌がらせ、過度な問い合わせ、同一内容の大量送信
            - 本サービスの運営、保守、セキュリティ、外部サービス連携を妨害する行為
            - 反社会的勢力に該当し、または反社会的勢力に協力、関与、利益供与する行為
            - 上記の行為を試みる行為、助長する行為、または第三者に行わせる行為
            - その他、上記に準じるものとして、合理的な理由に基づき運営者が不適切と判断する行為
        - title: 知的財産権・利用者コンテンツ
          paragraphs:
            - 本サービスに関する名称、ロゴ、デザイン、画面、プログラム、文章、画像、アイコン、データ構造、仕様、ノウハウその他本サービスを構成する一切の権利は、運営者または正当な権利を有する第三者に帰属します。
            - 利用者が本サービスにアップロードまたは入力したレシート画像、レシートデータ、問い合わせ内容その他の情報に関する権利は、利用者または正当な権利者に帰属します。
            - 利用者は、運営者に対し、本サービスの提供、保存、表示、OCR解析、AI補完、金額計算、通知、問い合わせ対応、障害調査、セキュリティ確保、バックアップ、復旧、品質改善その他本サービスの運営に必要な範囲で、利用者が本サービスにアップロードまたは入力した情報を利用することを許諾します。
            - 運営者は、利用者を識別できない形に集計または加工した統計情報を、本サービスの品質改善、安全性向上、利用状況の把握、機能改善のために利用することがあります。
            - 利用者は、自身がアップロードまたは入力する情報について、本サービス上で利用するために必要な権利、権限、同意を有していることを保証するものとします。
            - 利用者は、運営者の事前の承諾なく、本規約上の地位または本規約に基づく権利義務を、第三者に譲渡、移転、担保提供その他の処分をしてはなりません。
        - title: 外部サービス
          paragraphs:
            - 運営者は、本サービスの提供に必要な範囲で、OCR解析、AI補完、不正利用防止、メール送信、サービス提供環境の運用、監視その他の外部サービスを利用することがあります。
            - 外部サービスの利用に伴い、レシート画像、OCR結果、解析に必要なテキスト情報、IPアドレス、ブラウザや端末に関する情報、不正な送信かどうかを確認するための情報、メールアドレス、メール本文、利用状況に関する記録その他機能提供に必要な情報が、外部サービスへ送信または処理される場合があります。詳細はプライバシーポリシーに定めます。
            - 外部サービスは、当該外部サービスの提供会社が定める規約、ポリシー、仕様、制限に従って提供されます。外部サービスの障害、停止、仕様変更、利用条件の変更、利用制限、提供条件の変更、データ処理方針の変更その他の事由により、本サービスの全部または一部が利用できなくなる場合があります。
            - 運営者は、外部サービスの状態、仕様、継続提供、解析精度、処理速度、利用可能性について保証しません。
        - title: 利用制限・停止・登録抹消
          paragraphs:
            - 運営者は、利用者が次のいずれかに該当すると判断した場合、事前の通知なく、利用者による本サービスの全部または一部の利用を制限し、アカウントを停止し、レシートデータを削除し、または登録を抹消することがあります。
          items:
            - 本規約、プライバシーポリシー、運営者が定めるルールに違反した場合
            - 登録情報、入力内容、問い合わせ内容等に虚偽、誤り、不備、不適切な内容がある場合
            - 不正利用、攻撃、スパム、過度な負荷、セキュリティ上のリスクが確認された場合
            - 外部サービス、他の利用者、運営者または第三者に損害、不利益、リスクを与えるおそれがある場合
            - 一定期間利用がない場合
            - ゲスト利用者について、保存期間、利用期限、容量制限その他運用上の条件に該当した場合
            - 法令、裁判所、行政機関、外部サービス提供会社その他関係者から対応を求められた場合
            - その他、合理的な理由に基づき運営者が本サービスの提供継続が困難または不適切と判断した場合
          paragraphs_after:
            - 運営者は、本条に基づく措置により利用者に生じた不利益について、法令上認められる範囲で責任を負いません。ただし、運営者に故意または重過失がある場合、その他法令上責任を制限できない場合はこの限りではありません。
        - title: 退会・データ削除
          paragraphs:
            - 登録利用者は、本サービスが定める方法により、アカウントを削除し退会することができます。
            - 退会またはアカウント削除時には、当該アカウントに紐づくレシート、明細、通知、認証設定等の主要データを削除します。
            - ただし、問い合わせ履歴、安全管理・不正利用防止・操作確認のための記録、障害対応に必要な記録、バックアップ等については、法令遵守、不正利用防止、操作確認、障害対応、復旧対応に必要な範囲で、直ちに削除されず一定期間残る場合があります。
            - 削除されたデータは、通常の画面操作では復元できません。バックアップからの復旧は、障害対応、復旧対応、法令遵守その他運営上必要な場合に限られ、特定の利用者の希望に応じた個別復元を保証するものではありません。
            - 現時点で、運営者は利用者データの完全なエクスポート機能または移行機能の提供を保証しません。
        - title: サービス変更・中断・終了
          paragraphs:
            - 運営者は、次のいずれかに該当する場合、本サービスの全部または一部を変更、中断、停止または終了することがあります。
          items:
            - メンテナンス、アップデート、データ保守、バックアップ、復旧、セキュリティ対応を行う場合
            - 障害、通信障害、外部サービス障害、災害、停電、事故、法令対応その他不可抗力が発生した場合
            - セキュリティ上、運用上、技術上、法令上、本サービスの提供継続が困難または不適切と判断した場合
            - 外部サービスの仕様変更、停止、提供終了、利用条件変更等により、本サービスの提供が困難になった場合
            - 運営者の都合により、本サービスの内容変更または提供終了が必要になった場合
          paragraphs_after:
            - 運営者は、可能な範囲で事前に通知または本サービス上で案内するよう努めます。ただし、緊急の場合、やむを得ない場合、または通知が困難な場合は、事前の通知なく変更、中断、停止または終了することがあります。
        - title: 保証の否認
          paragraphs:
            - 運営者は、本サービスについて、事実上または法律上の瑕疵がないこと、安全性、信頼性、正確性、完全性、有用性、特定目的への適合性、継続提供、エラーや障害が発生しないこと、データが消失しないこと、外部サービスが継続して利用できることを保証しません。
            - 運営者は、OCR解析、AI補完、金額計算、カテゴリ推定、確認が必要な箇所の表示、通知、検索結果、外部サービスの稼働状況その他本サービスにより表示または生成される情報について、正確性、完全性、最新性、有用性を保証しません。
            - 利用者は、本サービスの内容、解析結果、計算結果、保存データを自己の責任で確認し、利用するものとします。
        - title: 免責・責任制限
          paragraphs:
            - 本サービスの利用に関連して利用者に損害が生じた場合であっても、運営者は、運営者に故意または重過失がある場合、または法令上責任を制限できない場合を除き、法令上認められる範囲で責任を負うものとします。
            - 運営者が責任を負う場合であっても、運営者は、運営者の責めに帰すべき事由により現実に発生した通常かつ直接の損害について、法令上認められる範囲で責任を負うものとし、特別損害、間接損害、逸失利益、データ消失に伴う損害、事業上の損害、第三者との紛争により生じた損害については、予見可能性の有無にかかわらず責任を負わないものとします。ただし、運営者に故意または重過失がある場合、または法令上この制限が認められない場合はこの限りではありません。
            - 利用者が本サービスの利用に関連して第三者との間で紛争、請求、問い合わせ、苦情、権利侵害その他の問題を生じさせた場合、利用者は自己の責任と費用でこれを解決するものとします。
            - 本条は、消費者契約法その他の法令により認められる範囲で適用されます。本規約のいずれかの条項が法令により無効または適用不能と判断された場合であっても、その他の条項は可能な限り有効に存続します。
            - 本規約のうち、性質上終了後も存続すべき条項は、利用者の退会、アカウント削除、本サービスの利用終了または本サービスの提供終了後も、必要な範囲で存続します。
        - title: プライバシーポリシー
          paragraphs:
            - 運営者は、本サービスにおける利用者情報の取扱いについて、別途プライバシーポリシーを定めます。
            - 利用者は、本サービスを利用するにあたり、プライバシーポリシーを確認し、その内容を理解したうえで本サービスを利用するものとします。
            - 本規約とプライバシーポリシーの内容が矛盾する場合、利用者情報の取扱いについてはプライバシーポリシーが優先して適用されます。
        - title: 反社会的勢力の排除
          paragraphs:
            - 利用者は、自らが反社会的勢力に該当しないこと、反社会的勢力に協力、関与、利益供与を行わないことを表明し、保証するものとします。
            - 利用者が本条に違反した場合、運営者は、事前の通知なく、本サービスの利用停止、アカウント削除その他必要な措置を講じることができます。
        - title: 未成年の利用
          paragraphs:
            - 未成年者が本サービスを利用する場合、保護者その他の法定代理人の同意を得たうえで利用するものとします。
            - 未成年者が本サービスを利用した場合、運営者は、法定代理人の同意を得て利用したものとして取り扱う場合があります。ただし、法令により異なる取扱いが必要な場合はこの限りではありません。
        - title: 規約変更
          paragraphs:
            - 運営者は、法令の変更、本サービスの内容変更、外部サービスの変更、運用方針の見直し、セキュリティ上の必要その他合理的な理由がある場合、本規約を変更することがあります。
            - 本規約を変更する場合、運営者は、変更内容および効力発生日を、本サービス上の掲示、通知その他適切な方法により周知します。
            - 変更後の本規約は、効力発生日から適用されます。利用者が効力発生日後に本サービスを利用した場合、変更後の本規約に同意したものとみなされる場合があります。
            - ただし、法令上、利用者の個別の同意が必要となる変更については、運営者は適切な方法により同意を取得します。
        - title: 準拠法・管轄
          paragraphs:
            - 本規約および本サービスの利用に関する準拠法は、日本法とします。
            - 本サービスに関して利用者と運営者との間で紛争が生じた場合、当事者は誠実に協議し、解決に努めるものとします。
            - 協議により解決しない場合の裁判手続については、法令に従って管轄裁判所を定めるものとします。
        - title: お問い合わせ
          paragraphs:
            - 本規約、本サービス、アカウント、利用者情報の取扱い、退会、その他本サービスに関するお問い合わせは、本サービスのお問い合わせフォームからご連絡ください。
            - 本人確認が必要なお問い合わせについては、運営者から追加情報の提供をお願いする場合があります。
        - title: 運営者情報
          paragraphs:
            - 本サービスは、運営者が提供します。
            - 運営者の氏名または名称、住所、連絡先等について、法令上または利用者からの正当な請求に基づき開示が必要な場合は、本サービスのお問い合わせフォームを通じて、必要な範囲で対応します。
    privacy:
      title: プライバシーポリシー
      meta_description: Recifyにおける利用者情報、レシート画像、OCR・AI補完、外部サービス利用、保存と削除の方針を掲載しています。
      lead: Recifyにおける利用者情報、レシート画像、OCR・AI補完、外部サービス利用、保存と削除の方針を説明します。
      last_updated_on: 2026年6月21日
      sections:
        - title: はじめに
          paragraphs:
            - Recifyの運営者（以下「運営者」といいます。）は、Recify（以下「本サービス」といいます。）における利用者情報の取扱いについて、以下のとおりプライバシーポリシーを定めます。
            - 本サービスは、レシート画像のアップロード、OCR解析、AI補完、明細整理、金額計算などを通じて、レシート管理を支援するサービスです。レシート画像や解析結果には、店舗名、購入日時、商品名、金額、購入履歴その他の個人に関する情報が含まれる場合があります。利用者は、アップロードする画像や入力内容に個人情報、第三者の情報、または利用を望まない情報が含まれていないか確認したうえで、本サービスを利用してください。
        - title: 定義と適用範囲
          paragraphs:
            - 本ポリシーにおいて「利用者情報」とは、利用者が本サービスに入力、アップロード、送信する情報、本サービスの利用に伴って生成される情報、および本サービスの運用上取得される技術情報をいいます。
            - 本ポリシーにおいて「個人情報」とは、個人情報の保護に関する法律に定める個人情報をいいます。レシート画像、購入履歴、問い合わせ内容、ログ等は、それ単体では個人を識別できない場合でも、他の情報と照合することで個人に関する情報となる場合があります。
            - 本ポリシーは、本サービスの利用に関して運営者が取り扱う利用者情報に適用されます。
        - title: 取得する情報
          paragraphs:
            - 運営者は、本サービスの提供に必要な範囲で、次の情報を取得または保存することがあります。
          items:
            - メールアドレス、パスワードを安全に照合するための情報、表示名、メール確認、ログイン、ロック、ログイン状態の保持、パスキー、二要素認証、リカバリーコード、テーマ設定、法務文書への同意日時、アカウント設定等のアカウント・認証に関する情報
            - レシート画像、店舗名、店舗住所、電話番号、購入日時、商品名、明細、数量、単位、カテゴリ、メモ、小計、税額、合計、税率、支払方法、割引、ポイント利用、調整額、OCR解析結果、AI補完結果、解析状態、エラー情報、確認が必要な理由等のレシート管理に関する情報
            - 氏名または表示名、メールアドレス、問い合わせカテゴリ、件名、本文、問い合わせ時のIPアドレス、ブラウザや端末に関する情報、問い合わせ対応や障害調査に必要な識別情報等の問い合わせに関する情報
            - 通知、安全管理・不正利用防止・操作確認のための記録、アクセス日時、IPアドレス、ブラウザや端末に関する情報、アクセスに関する情報、外部サービスの稼働状態、障害や不具合の内容、保存容量、利用回数、上限管理等の運用・安全管理に関する情報
        - title: 情報の取得方法
          items:
            - 利用者がアカウント登録、ログイン、設定変更、問い合わせ、レシート登録、画像アップロード、明細編集等の際に入力または送信する方法
            - 利用者がアップロードしたレシート画像、プロフィール画像、その他の添付画像から取得する方法
            - OCR解析、AI補完、金額計算、通知生成、ストレージ使用量計算等、本サービスの機能提供に伴って生成される方法
            - 利用者が本サービスへアクセスまたは操作した際に、安全管理のための記録、操作記録、Cookie、ログイン状態を維持するための情報、ブラウザの保存領域等を通じて自動的に取得する方法
            - 不正利用防止、メール送信、OCR解析、AI補完等に必要な外部サービスから、本サービスの処理結果または状態情報として取得する方法
        - title: 利用目的
          paragraphs:
            - 運営者は、取得した情報を次の目的で利用します。
          items:
            - 本サービスの登録、本人確認、ログイン、アカウント管理のため
            - レシート画像の保存、OCR解析、AI補完、明細整理、金額計算、検索、表示などの機能を提供するため
            - 問い合わせへの回答、本人確認、必要な連絡を行うため
            - メール確認、パスワード再設定、重要なお知らせ等を送信するため
            - 不正利用、攻撃、スパム、なりすまし、規約違反等を検知・防止するため
            - 障害調査、品質改善、セキュリティ向上、利用状況の確認のため
            - ストレージ容量、利用回数、解析回数等の制限を管理するため
            - 法令、規約、ポリシーに基づく対応を行うため
          paragraphs_after:
            - 運営者は、法令により認められる場合を除き、上記の利用目的の達成に必要な範囲を超えて利用者情報を取り扱いません。利用目的を変更する場合は、変更後の利用目的が変更前の利用目的と関連性を有すると合理的に認められる範囲で行い、必要に応じて本サービス上で公表または通知します。
        - title: レシート画像・OCR・AI補完で扱う情報
          paragraphs:
            - 本サービスでは、利用者がアップロードしたレシート画像や、OCRにより抽出された文字情報、利用者が入力・修正したレシート情報をもとに、明細整理や金額計算を行います。
            - OCR解析では、レシート画像が外部のOCR解析サービスへ送信される場合があります。AI補完では、OCRで抽出された文字列、店舗名候補、購入日時候補、支払情報、税額情報、明細候補など、補完に必要な範囲の情報が外部のAI処理サービスへ送信される場合があります。
            - AI補完では、原則としてレシート画像そのものではなく、OCR結果や解析に必要なテキスト・構造化情報を利用します。ただし、利用者がレシート画像に個人情報や第三者の情報を含めた場合、OCR結果や解析対象情報にそれらが含まれる可能性があります。
            - レシートには、医療機関、薬局、嗜好品、宗教・政治活動に関する支出その他、利用者の生活状況や属性を推測し得る情報が含まれる場合があります。本サービスは、これらの情報の取得を積極的に目的とするものではありませんが、利用者がアップロードしたレシート画像や入力内容に含まれる場合があります。利用者は、必要に応じて画像や入力内容を確認し、利用を望まない情報を含めないよう注意してください。
            - 運営者は、外部サービスに送信する情報を、機能提供に必要な範囲に限定するよう努めます。また、外部サービスの認証情報、運営上の詳細な記録、外部サービスの詳細なエラー内容など、利用者への表示や保存に不要な情報を公開画面に表示しないよう管理します。
        - title: 外部サービスの利用および外部送信
          paragraphs:
            - 運営者は、本サービスの提供に必要な範囲で、OCR解析、AI補完、不正利用防止、メール送信、サービス提供環境の運用等の外部サービスを利用することがあります。
            - 外部サービスへ送信される情報は、利用する機能や設定により異なります。運営者は、外部サービスの利用にあたり、送信される情報、送信先、利用目的を利用者が確認できるようにします。
            - 本サービスで想定される外部送信の概要は次のとおりです。公開時点で利用する正式なサービス名、提供会社、送信情報、利用目的は、公開前に確定します。
          table:
            headers:
              - 送信先または外部サービスの分類
              - 送信される可能性がある情報
              - 利用目的
            rows:
              - - OCR解析サービス
                - レシート画像、画像から抽出される文字情報、解析に必要な関連情報
                - レシート画像から店舗名、日時、金額、明細等を抽出するため
              - - AI処理サービス
                - OCR結果、店舗名候補、購入日時候補、金額・税額・明細候補、利用者が入力または修正したレシート情報の一部
                - 明細整理、金額補完、カテゴリ候補、確認が必要な箇所の判定を支援するため
              - - 不正利用防止サービス
                - IPアドレス、ブラウザや端末に関する情報、不正な送信かどうかを確認するための情報、フォーム送信に関する情報
                - 自動送信、スパム、不正送信を防止するため
              - - メール送信サービス
                - メールアドレス、メール本文、確認URL、パスワード再設定URL、問い合わせ返信に必要な情報
                - 確認メール、重要通知、問い合わせ返信等を送信するため
              - - サービス提供環境・保存基盤
                - アクセスに関する情報、IPアドレス、アクセス記録、サービス運用上の記録、保存データ
                - 本サービスの提供、保守、障害対応、バックアップ、復旧のため
          paragraphs_after:
            - 外部サービスの提供会社やデータ処理拠点が国外に所在する場合があります。その場合、運営者は、適用される法令や外部サービス提供会社の公表情報を確認し、必要な情報提供を行うよう努めます。
        - title: 第三者提供、委託および共同利用
          paragraphs:
            - 運営者は、次の場合を除き、利用者の個人データを第三者に提供しません。
          items:
            - 利用者の同意がある場合
            - 法令に基づく場合
            - 人の生命、身体または財産の保護のために必要があり、本人の同意を得ることが困難な場合
            - 公衆衛生の向上または児童の健全な育成の推進のために特に必要があり、本人の同意を得ることが困難な場合
            - 国の機関、地方公共団体またはその委託先への協力が必要で、本人の同意により当該事務の遂行に支障を及ぼすおそれがある場合
            - 本サービスの提供に必要な範囲で、外部サービス提供会社、メール送信事業者、サービス提供基盤の事業者等に業務を委託する場合
            - 合併、事業譲渡、その他の事業承継に伴って、本サービスの運営に必要な範囲で利用者情報が承継される場合
          paragraphs_after:
            - 外部サービスや委託先に情報を取り扱わせる場合、運営者は、必要な範囲で委託先を管理し、情報の適切な取扱いに努めます。
            - 運営者は、利用者の個人情報を販売しません。
            - 現時点で、運営者は個人データの共同利用を行いません。将来、共同利用を行う場合は、共同利用する情報の項目、共同利用者の範囲、利用目的、管理責任者等、法令上必要な事項をあらかじめ公表または通知します。
        - title: 匿名化情報・統計情報の利用
          paragraphs:
            - 運営者は、本サービスの品質向上、機能改善、障害調査、セキュリティ向上、利用状況の把握のため、利用者を識別できない形式に集計または加工した統計情報を利用することがあります。
            - この場合、特定の利用者を識別できる形で第三者へ提供することはありません。また、広告配信や行動ターゲティングを目的として、利用者のレシート内容や購入履歴を第三者に販売または提供することはありません。
        - title: 保存期間と削除
          paragraphs:
            - 運営者は、取得した情報を、利用目的の達成に必要な期間保存します。
            - 利用者がレシート、画像、アカウント情報等を削除した場合、または退会・アカウント削除を行った場合、運営者は、当該アカウントに紐づくレシート、明細、通知、認証設定等を削除します。
            - ただし、問い合わせ履歴、安全管理・不正利用防止・操作確認のための記録、障害対応に必要な記録、バックアップ等については、法令遵守、不正利用防止、監査、障害対応、復旧対応に必要な範囲で、直ちに削除されず一定期間残る場合があります。
            - ゲスト利用者のアカウントやデータは、一定期間利用がない場合に削除されることがあります。問い合わせ情報は、対応完了後、一定期間経過後に匿名化される場合があります。安全管理・不正利用防止・操作確認のための記録、解析履歴、画像データ等は、本サービスの運用上必要な保持期間に従って削除または匿名化されます。
        - title: Cookie等の利用
          paragraphs:
            - 本サービスでは、ログイン状態の維持、本人確認、不正な操作の防止、安全管理、不正利用防止、表示設定、フォームや画面操作の補助のために、Cookie、ログイン状態を維持するための情報、ブラウザの保存領域等を利用することがあります。
            - 本サービスでは、現時点で広告配信や行動ターゲティングを目的としたアクセス解析サービスは利用していません。将来、アクセス解析、広告、エラー監視等の外部サービスを追加する場合は、必要に応じて本ポリシーを改定し、送信される情報、送信先、利用目的を明示します。
            - 不正利用防止サービスを有効にしている場合、利用者の端末やブラウザに関する情報、IPアドレス、不正な送信かどうかを確認するための情報等が、当該サービス提供会社へ送信されることがあります。これらの情報は、自動送信やスパム等の不正な送信を防止する目的で利用されます。
        - title: 安全管理措置・漏えい等への対応
          paragraphs:
            - 運営者は、利用者情報の漏えい、滅失、毀損、不正アクセス等を防止するため、必要かつ適切な安全管理措置を講じるよう努めます。
          items:
            - パスワードを元の文字列のまま保存しない仕組み
            - 二要素認証、パスキー、リカバリーコード等の認証機能
            - 不正な操作や過度なアクセスを防ぐためのアクセス制御
            - 重要な操作時の再確認と操作記録
            - レシートや管理画面の識別子を推測されにくくする仕組み
            - アップロード可能なファイル形式、サイズ、画像寸法の制限
            - 画像アップロード経路の制限
            - 認証情報や秘密情報が記録に残りにくいようにする制御
            - OCR/AI関連サービスの詳細な応答内容や利用者向けでないエラー内容を公開画面に表示しないための制御
          paragraphs_after:
            - ただし、インターネット上の通信やシステム運用において、完全な安全性を保証するものではありません。利用者も、パスワード、認証情報、端末の管理に注意してください。
            - 利用者情報の漏えい、滅失、毀損その他の事故が発生した場合、運営者は、影響範囲の確認、原因調査、再発防止、利用者への通知、関係機関への報告等、法令および状況に応じて必要な対応を行います。
        - title: ユーザーによる確認・訂正・削除等
          paragraphs:
            - 利用者は、本サービスの画面上で、登録情報、レシート情報、画像、設定等を確認、修正、削除できる場合があります。
            - 利用者本人から、保有個人データの開示、訂正、削除、利用停止等に関する請求があった場合、運営者は、本人確認を行ったうえで、法令に従い適切に対応します。ただし、法令上、運用上、監査上またはセキュリティ上必要な範囲で、請求の全部または一部に応じられない場合があります。
            - 請求の内容によっては、本人確認のための追加情報の提供をお願いする場合があります。また、法令により認められる範囲で、回答方法、手続、手数料等を定める場合があります。
        - title: 未成年の利用
          paragraphs:
            - 未成年の方が本サービスを利用する場合は、保護者その他の法定代理人の同意を得たうえで利用してください。
        - title: お問い合わせ
          paragraphs:
            - 本ポリシー、利用者情報の取扱い、開示・訂正・削除等の請求、苦情または相談に関するお問い合わせは、本サービスのお問い合わせフォームからご連絡ください。
            - 本人確認が必要なお問い合わせについては、運営者から追加情報の提供をお願いする場合があります。運営者情報について開示が必要な場合は、法令および本サービスの運用上必要な範囲で対応します。
        - title: プライバシーポリシーの変更
          paragraphs:
            - 運営者は、法令の改正、本サービスの内容変更、外部サービスの追加または変更、運用方針の見直し等に応じて、本ポリシーを変更することがあります。
            - 重要な変更を行う場合は、本サービス上での掲示、通知その他適切な方法により利用者へ周知します。変更後のポリシーは、本サービス上に掲載した時点から適用されます。
        - title: 運営者情報
          paragraphs:
            - 本サービスは、運営者が提供します。
            - 運営者の氏名または名称、住所、連絡先等について、法令上または利用者からの正当な請求に基づき開示が必要な場合は、本サービスのお問い合わせフォームを通じて、必要な範囲で対応します。
