default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: default
      threads: <%= ENV.fetch("DEFAULT_JOB_THREADS", 3) %>
      processes: <%= ENV.fetch("DEFAULT_JOB_CONCURRENCY") { ENV.fetch("JOB_CONCURRENCY", 1) } %>
      polling_interval: 0.1
    - queues: receipt_ocr
      threads: <%= ENV.fetch("RECEIPT_OCR_THREADS", 1) %>
      processes: <%= ENV.fetch("RECEIPT_OCR_CONCURRENCY", 1) %>
      polling_interval: 0.1
    - queues: receipt_ai
      threads: <%= ENV.fetch("RECEIPT_AI_THREADS", 1) %>
      processes: <%= ENV.fetch("RECEIPT_AI_CONCURRENCY", 1) %>
      polling_interval: 0.1
    - queues: receipt_finalize
      threads: <%= ENV.fetch("RECEIPT_FINALIZE_THREADS", 1) %>
      processes: <%= ENV.fetch("RECEIPT_FINALIZE_CONCURRENCY", 1) %>
      polling_interval: 0.1
    - queues: solid_queue_recurring
      threads: 1
      processes: 1
      polling_interval: 1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
