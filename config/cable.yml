# Async adapter only works within the same process. When development runs Solid Queue workers in Puma,
# use Solid Cable too so Turbo Stream broadcasts from worker processes can reach browser subscribers.
development:
  <% if ActiveModel::Type::Boolean.new.cast(ENV["USE_SOLID_QUEUE_IN_DEVELOPMENT"]) %>
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day
  <% else %>
  adapter: async
  <% end %>

test:
  adapter: test

production:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day
