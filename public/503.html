<!doctype html>
<html lang="en">
  <head>
    <title>Temporarily Unavailable - Recify</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#e8e9ff">
    <link rel="icon" href="/icon.png" type="image/png">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta http-equiv="cache-control" content="no-store">
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="0">
    <style>
      :root {
        color-scheme: light;
        --bg-page: #fafafa;
        --bg-card: #ffffff;
        --bg-card-subtle: #f4f4f4;
        --text-base: #1c1b1b;
        --text-muted: #464555;
        --brand-primary: #4b4dd8;
        --brand-gradient-start: #8a8cff;
        --brand-gradient-end: #4b4dd8;
        --border-soft: rgba(199, 196, 216, 0.35);
        --shadow-card:
          0 20px 40px rgba(49, 48, 192, 0.08),
          0 0 0 1px rgba(49, 48, 192, 0.06);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --bg-page: #131313;
          --bg-card: #201f1f;
          --bg-card-subtle: #1c1b1b;
          --text-base: #e5e2e1;
          --text-muted: #c7c4d8;
          --brand-primary: #c0c1ff;
          --brand-gradient-start: #c0c1ff;
          --brand-gradient-end: #4b4dd8;
          --border-soft: rgba(255, 255, 255, 0.05);
          --shadow-card:
            0 20px 40px rgba(49, 46, 129, 0.35),
            0 0 0 1px rgba(229, 226, 225, 0.05);
        }
      }

      *, *::before, *::after { box-sizing: border-box; }
      * { margin: 0; }

      html {
        min-height: 100%;
        font-size: 16px;
        -webkit-text-size-adjust: 100%;
      }

      body {
        min-height: 100dvh;
        background: var(--bg-page);
        color: var(--text-base);
        font-family: Inter, "Noto Sans JP", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      .ambient-background {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        overflow: hidden;
      }

      .ambient-glow {
        position: absolute;
        width: 24rem;
        height: 24rem;
        border-radius: 9999px;
        background: linear-gradient(135deg, var(--brand-gradient-start), var(--brand-gradient-end));
        opacity: 0;
        filter: blur(120px);
      }

      .ambient-glow:first-child { top: -6rem; left: -6rem; }
      .ambient-glow:last-child { right: -6rem; bottom: -6rem; }

      @media (prefers-color-scheme: dark) {
        .ambient-glow { opacity: 0.1; }
      }

      .page {
        position: relative;
        z-index: 1;
        display: flex;
        min-height: 100dvh;
        flex-direction: column;
      }

      main {
        display: flex;
        flex: 1 1 auto;
        align-items: center;
        justify-content: center;
        padding: 3rem 1.5rem;
      }

      .wrap {
        width: 100%;
        max-width: 32rem;
      }

      .card {
        border: 1px solid var(--border-soft);
        border-radius: 1.5rem;
        background: color-mix(in srgb, var(--bg-card) 92%, transparent);
        box-shadow: var(--shadow-card);
        padding: 3rem 2rem;
        text-align: center;
      }

      .icon {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 5rem;
        height: 5rem;
        margin: 0 auto 2rem;
        border: 1px solid var(--border-soft);
        border-radius: 9999px;
        background: var(--bg-card-subtle);
        color: var(--brand-primary);
        font-size: 2.5rem;
      }

      h1 {
        font-size: clamp(1.5rem, 3vw, 1.625rem);
        font-weight: 500;
        line-height: 1.35;
        letter-spacing: 0;
      }

      p {
        max-width: 24rem;
        margin: 1rem auto 0;
        color: var(--text-muted);
        font-size: 0.9375rem;
        line-height: 1.9;
      }

      .code {
        margin-top: 2.5rem;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        font-size: 0.75rem;
      }

      footer {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        padding: 1rem 1.5rem 1.5rem;
        color: var(--text-muted);
        font-size: 0.75rem;
      }

      .brand {
        color: var(--text-base);
        letter-spacing: 0.2em;
      }

      @media (max-width: 40rem) {
        .card { padding: 2.5rem 1.5rem; }
        footer {
          flex-direction: column;
          align-items: center;
          text-align: center;
        }
      }
    </style>
  </head>
  <body>
    <div class="ambient-background" aria-hidden="true">
      <div class="ambient-glow"></div>
      <div class="ambient-glow"></div>
    </div>

    <div class="page">
      <main>
        <div class="wrap">
          <section class="card" aria-labelledby="error-title">
            <div class="icon" aria-hidden="true">503</div>
            <h1 id="error-title" data-i18n-key="heading">Temporarily Unavailable</h1>
            <p data-i18n-key="message">The site is temporarily unavailable due to high traffic. Please try again later.</p>
            <p class="code">Error Code: 503</p>
          </section>
        </div>
      </main>

      <footer>
        <p class="brand">Recify</p>
        <p>© 2026 Recify</p>
      </footer>
    </div>
    <script type="application/json" id="error-page-i18n">
      {
        "ja": {
          "pageTitle": "ただいま一時停止しています - Recify",
          "heading": "ただいま一時停止しています",
          "message": "アクセス集中のため、サイトを一時的に停止しています。しばらく時間をおいてから再度お試しください。"
        }
      }
    </script>
<script>
  (() => {
    const languages = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language]).filter(Boolean);
    const locale = languages.some((language) => language.toLowerCase().startsWith("ja")) ? "ja" : "en";
    document.documentElement.lang = locale;
    if (locale !== "ja") return;

    const dataElement = document.getElementById("error-page-i18n");
    if (!dataElement) return;

    try {
      const messages = JSON.parse(dataElement.textContent).ja;
      document.title = messages.pageTitle;

      document.querySelectorAll("[data-i18n-key]").forEach((element) => {
        const text = messages[element.dataset.i18nKey];
        if (typeof text === "string") {
          element.textContent = text;
        }
      });
    } catch (_error) {
      document.documentElement.lang = "en";
    }
  })();
</script>
  </body>
</html>
