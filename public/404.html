<!doctype html>
<html lang="en">
  <head>
    <title>Page Not Found - Recify</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#e8e9ff">
    <link rel="icon" href="/icon.png" type="image/png">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <style>
      :root {
        color-scheme: light;
        --bg-page: #fafafa;
        --bg-card: #ffffff;
        --bg-card-subtle: #f4f4f4;
        --text-base: #1c1b1b;
        --text-muted: #464555;
        --brand-primary: #4b4dd8;
        --brand-gradient-start: #8a8cff;
        --brand-gradient-end: #4b4dd8;
        --border-soft: rgba(199, 196, 216, 0.35);
        --neutral-glass-border: rgba(199, 196, 216, 0.35);
        --surface-card-indigo-shadow:
          0 20px 40px rgba(49, 48, 192, 0.08),
          0 0 0 1px rgba(49, 48, 192, 0.06);
        --shadow-card:
          0 20px 40px rgba(0, 0, 0, 0.05),
          0 0 0 1px rgba(0, 0, 0, 0.02);
        --glow-1: rgba(49, 48, 192, 0.12);
        --glow-2: rgba(75, 77, 216, 0.08);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --bg-page: #131313;
          --bg-card: #201f1f;
          --bg-card-subtle: #1c1b1b;
          --text-base: #e5e2e1;
          --text-muted: #c7c4d8;
          --brand-primary: #c0c1ff;
          --brand-gradient-start: #c0c1ff;
          --brand-gradient-end: #4b4dd8;
          --border-soft: rgba(255, 255, 255, 0.05);
          --neutral-glass-border: rgba(255, 255, 255, 0.05);
          --surface-card-indigo-shadow:
            0 20px 40px rgba(49, 46, 129, 0.35),
            0 0 0 1px rgba(229, 226, 225, 0.05);
          --shadow-card:
            0 20px 40px rgba(99, 102, 241, 0.05),
            0 0 0 1px rgba(255, 255, 255, 0.05);
          --glow-1: rgba(192, 193, 255, 0.16);
          --glow-2: rgba(75, 77, 216, 0.12);
        }
      }

      *, *::before, *::after { box-sizing: border-box; }
      * { margin: 0; }

      html {
        min-height: 100%;
        font-size: 16px;
        -webkit-text-size-adjust: 100%;
      }

      body {
        min-height: 100dvh;
        background: var(--bg-page);
        color: var(--text-base);
        font-family: Inter, "Noto Sans JP", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      .ambient-background {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        overflow: hidden;
      }

      .ambient-glow {
        position: absolute;
        width: 24rem;
        height: 24rem;
        border-radius: 9999px;
        background: linear-gradient(135deg, var(--brand-gradient-start), var(--brand-gradient-end));
        opacity: 0;
        filter: blur(120px);
      }

      .ambient-glow:first-child { top: -6rem; left: -6rem; }
      .ambient-glow:last-child { right: -6rem; bottom: -6rem; }

      @media (prefers-color-scheme: dark) {
        .ambient-glow { opacity: 0.1; }
      }

      .page {
        position: relative;
        z-index: 1;
        display: flex;
        min-height: 100dvh;
        flex-direction: column;
      }

      main {
        display: flex;
        flex: 1 1 auto;
        align-items: center;
        justify-content: center;
        padding: 3rem 1.5rem;
      }

      .wrap {
        width: 100%;
        max-width: 32rem;
      }

      .card {
        position: relative;
        width: 100%;
        overflow: hidden;
        border-radius: 0.75rem;
        border: 1px solid var(--neutral-glass-border);
        background: var(--bg-card);
        padding: 1.5rem;
        text-align: center;
        box-shadow: var(--surface-card-indigo-shadow);
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
      }

      .icon-circle {
        display: flex;
        width: 5rem;
        height: 5rem;
        align-items: center;
        justify-content: center;
        margin: 0 auto 2rem;
        border: 1px solid var(--border-soft);
        border-radius: 9999px;
        background: var(--bg-card-subtle);
        color: var(--brand-primary);
        box-shadow: var(--shadow-card);
      }

      .icon-circle svg {
        width: 2.5rem;
        height: 2.5rem;
      }

      .content {
        display: grid;
        gap: 1rem;
      }

      h1 {
        color: var(--text-base);
        font-size: 1.5rem;
        line-height: 2rem;
        font-weight: 700;
        letter-spacing: 0;
        text-wrap: balance;
      }

      p {
        max-width: 24rem;
        margin: 0 auto;
        color: var(--text-muted);
        font-size: 0.875rem;
        line-height: 1.75rem;
      }

      .error-code {
        margin-top: 2rem;
        color: var(--text-muted);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        font-size: 0.75rem;
      }

      footer {
        padding: 1rem 1.5rem calc(env(safe-area-inset-bottom) + 1.5rem);
      }

      .footer-inner {
        display: flex;
        width: 100%;
        max-width: 120rem;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
        margin: 0 auto;
        text-align: center;
      }

      .brand {
        color: var(--text-base);
        font-size: 0.875rem;
        font-weight: 700;
        letter-spacing: 0.2em;
      }

      .copyright {
        color: var(--text-muted);
        font-size: 0.75rem;
      }

      @media (min-width: 640px) {
        .footer-inner {
          flex-direction: row;
          text-align: left;
        }
      }

      @media (min-width: 768px) {
        main { padding-top: 4rem; padding-bottom: 4rem; }
        h1 { font-size: 1.625rem; line-height: 2.125rem; }
        p { font-size: 1rem; }
      }

      @media (min-width: 1024px) {
        .card { padding: 2rem; }
      }
    </style>
  </head>
  <body>
    <div class="ambient-background" aria-hidden="true">
      <div class="ambient-glow"></div>
      <div class="ambient-glow"></div>
    </div>

    <div class="page">
      <main>
        <div class="wrap">
          <section class="card" aria-labelledby="error-title">
            <div class="icon-circle" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" focusable="false">
                <circle cx="10.5" cy="10.5" r="6.5"></circle>
                <path d="M17 17l4 4"></path>
                <path d="M6.8 10.5h7.4"></path>
                <path d="M10.5 4c1.5 1.7 2.2 3.8 2.2 6.5s-.7 4.8-2.2 6.5"></path>
                <path d="M10.5 4c-1.5 1.7-2.2 3.8-2.2 6.5s.7 4.8 2.2 6.5"></path>
              </svg>
            </div>
            <div class="content">
              <h1 id="error-title" data-i18n-key="heading">Page Not Found</h1>
              <p data-i18n-key="message">The page you are looking for could not be found.</p>
            </div>
            <p class="error-code">Error Code: 404</p>
          </section>
        </div>
      </main>

      <footer>
        <div class="footer-inner">
          <p class="brand">Recify</p>
          <p class="copyright">© 2026 Recify</p>
        </div>
      </footer>
    </div>
    <script type="application/json" id="error-page-i18n">
      {
        "ja": {
          "pageTitle": "ページが見つかりません - Recify",
          "heading": "ページが見つかりません",
          "message": "お探しのページは見つかりませんでした。"
        }
      }
    </script>
<script>
  (() => {
    const languages = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language]).filter(Boolean);
    const locale = languages.some((language) => language.toLowerCase().startsWith("ja")) ? "ja" : "en";
    document.documentElement.lang = locale;
    if (locale !== "ja") return;

    const dataElement = document.getElementById("error-page-i18n");
    if (!dataElement) return;

    try {
      const messages = JSON.parse(dataElement.textContent).ja;
      document.title = messages.pageTitle;

      document.querySelectorAll("[data-i18n-key]").forEach((element) => {
        const text = messages[element.dataset.i18nKey];
        if (typeof text === "string") {
          element.textContent = text;
        }
      });
    } catch (_error) {
      document.documentElement.lang = "en";
    }
  })();
</script>
  </body>
</html>
