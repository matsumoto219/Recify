name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  classify_changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed files
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          docs_only=false
          diff_range=""
          base_sha=""
          head_sha=""
          separator=""

          if [[ "$EVENT_NAME" == "pull_request" ]] &&
             [[ -n "$PR_BASE_SHA" ]] &&
             [[ -n "$PR_HEAD_SHA" ]]; then
            base_sha="$PR_BASE_SHA"
            head_sha="$PR_HEAD_SHA"
            separator="..."
          elif [[ "$EVENT_NAME" == "push" ]] &&
               [[ -n "$PUSH_BASE_SHA" ]] &&
               [[ "$PUSH_BASE_SHA" != "0000000000000000000000000000000000000000" ]] &&
               [[ -n "$PUSH_HEAD_SHA" ]]; then
            base_sha="$PUSH_BASE_SHA"
            head_sha="$PUSH_HEAD_SHA"
            separator=".."
          fi

          if [[ -n "$base_sha" ]] &&
             [[ -n "$head_sha" ]] &&
             git cat-file -e "${base_sha}^{commit}" 2>/dev/null &&
             git cat-file -e "${head_sha}^{commit}" 2>/dev/null; then
            diff_range="${base_sha}${separator}${head_sha}"
            changed_file_count=0
            docs_only=true

            while IFS= read -r -d '' path; do
              changed_file_count=$((changed_file_count + 1))

              case "$path" in
                README.md|.github/readme/*)
                  ;;
                *)
                  docs_only=false
                  ;;
              esac
            done < <(git diff --name-only --no-renames -z "$diff_range")

            if (( changed_file_count == 0 )); then
              docs_only=false
            fi
          fi

          if [[ "$docs_only" == "true" ]]; then
            git diff --check "$diff_range"
          fi

          printf 'docs_only=%s\n' "$docs_only" >> "$GITHUB_OUTPUT"

  scan_ruby:
    needs: classify_changes
    if: needs.classify_changes.result == 'success' && needs.classify_changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --quiet --no-pager --exit-on-warn --exit-on-error
      
      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit
      
  scan_js:
    needs: classify_changes
    if: needs.classify_changes.result == 'success' && needs.classify_changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    needs: classify_changes
    if: always()
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Verify change classification
        env:
          CLASSIFICATION_RESULT: ${{ needs.classify_changes.result }}
        run: test "$CLASSIFICATION_RESULT" = "success"

      - name: Record documentation-only validation
        if: needs.classify_changes.outputs.docs_only == 'true'
        run: echo "Documentation-only scope and whitespace checks passed."

      - name: Checkout code
        if: needs.classify_changes.outputs.docs_only != 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up Ruby
        if: needs.classify_changes.outputs.docs_only != 'true'
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          bundler-cache: true

      - name: Set up Node.js
        if: needs.classify_changes.outputs.docs_only != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install JavaScript dependencies
        if: needs.classify_changes.outputs.docs_only != 'true'
        run: npm ci

      - name: Prepare RuboCop cache
        if: needs.classify_changes.outputs.docs_only != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        if: needs.classify_changes.outputs.docs_only != 'true'
        run: bin/rubocop -f github

      - name: Lint JavaScript
        if: needs.classify_changes.outputs.docs_only != 'true'
        run: npm run lint:js

      - name: Check JavaScript syntax
        if: needs.classify_changes.outputs.docs_only != 'true'
        run: for file in app/javascript/controllers/*.js; do node --check "$file" || exit 1; done

      - name: Lint CSS
        if: needs.classify_changes.outputs.docs_only != 'true'
        run: npx stylelint "app/assets/tailwind/**/*.css"

      - name: Test CSS lint configuration
        if: needs.classify_changes.outputs.docs_only != 'true'
        run: npm run test:stylelint

  rspec:
    needs: classify_changes
    if: needs.classify_changes.result == 'success' && needs.classify_changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1
          - 2
          - 3
          - 4

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: recify_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d recify_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      RSPEC_SHARD: ${{ matrix.shard }}
      RSPEC_SHARD_COUNT: 4
      RSPEC_SEED: ${{ github.run_number }}

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          bundler-cache: true

      - name: Install and verify libvips
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libvips-tools
          vips --version

      - name: Check for duplicate workspace files
        run: bin/check_duplicate_files

      - name: Prepare test database
        run: bin/rails db:test:prepare

      - name: Build Tailwind CSS for test assets
        run: |
          bin/rails tailwindcss:build
          test -s app/assets/builds/tailwind.css

      - name: Check Zeitwerk autoloading
        run: bundle exec rails zeitwerk:check

      - name: Validate generated receipt fixtures
        run: ruby bin/generated_receipts_validate

      - name: Run RSpec including system specs
        run: bundle exec ruby bin/rspec_shard --index "$RSPEC_SHARD" --total "$RSPEC_SHARD_COUNT" --seed "$RSPEC_SEED"

      - name: Run Minitest
        if: matrix.shard == 1
        run: bin/rails test

      - name: Record RSpec metrics
        if: always()
        shell: bash
        run: |
          report="tmp/rspec/shard-${RSPEC_SHARD}.json"
          if [[ -f "$report" ]]; then
            ruby -rjson -e '
              metrics = JSON.parse(File.read(ARGV.fetch(0)))
              puts "### RSpec shard #{metrics.fetch("shard")}/#{metrics.fetch("shard_count")}"
              puts "| Metric | Value |", "| --- | ---: |"
              %w[file_count example_count failure_count pending_count errors_outside_of_examples_count seed duration wall_time user_time system_time].each do |key|
                puts "| #{key} | #{metrics.fetch(key)} |"
              end
            ' "$report" >> "$GITHUB_STEP_SUMMARY"
          fi

  test:
    needs:
      - classify_changes
      - rspec
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Verify complete test results
        shell: bash
        env:
          CLASSIFICATION_RESULT: ${{ needs.classify_changes.result }}
          DOCS_ONLY: ${{ needs.classify_changes.outputs.docs_only }}
          RSPEC_RESULT: ${{ needs.rspec.result }}
        run: |
          set -euo pipefail
          test "$CLASSIFICATION_RESULT" = "success"

          if [[ "$DOCS_ONLY" == "true" ]]; then
            test "$RSPEC_RESULT" = "skipped"
            echo "Documentation-only scope and whitespace checks passed."
          elif [[ "$DOCS_ONLY" == "false" ]]; then
            test "$RSPEC_RESULT" = "success"
            echo "Every RSpec shard and the Minitest suite passed."
          else
            echo "Change classification is missing or invalid."
            exit 1
          fi
